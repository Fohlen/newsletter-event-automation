on:
  push

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --locked
      - name: Run mypy
        run: uv run mypy newsletter_automation tests
      - name: Run tests
        run: uv run pytest -m "not integration"
