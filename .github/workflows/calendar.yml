on:
  workflow_dispatch:
  schedule:
    - cron: '39 20,12 * * *'

jobs:
  create_event_summaries:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - name: Install mpop
        run: sudo apt-get install -y mpop
      - name: Configure mpop
        env:
          MPOPRC: ${{ secrets.MPOPRC }}
        run: |
          envsubst <<< $(echo $MPOPRC | base64 --decode) > ~/.mpoprc
          chmod 600 ~/.mpoprc
      - name: Run mpop
        run: mpop
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies and CLI tools
        run: |
          uv sync --frozen
          uv tool install llm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Setup Ollama
        uses: ai-action/setup-ollama@v2
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-qwen2.5-7b-instruct
      - name: Start Ollama and pull model
        run: |
          ollama serve &
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama pull qwen2.5:7b-instruct
      - name: Configure Ollama model for llm
        run: |
          llm keys set ollama --value ollama
          llm openai endpoint add http://localhost:11434/v1 -m qwen2.5:7b-instruct --key ollama --supports-schema
          llm models default qwen2.5:7b-instruct
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Configure newsletter_automation
        run: envsubst < example.ini > config.ini
      - name: Create event summaries
        run: uv run python -m newsletter_automation
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: '*.ics'
