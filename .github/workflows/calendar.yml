on:
  workflow_dispatch:
#  schedule:
#    - cron: '39 20,12 * * *'

jobs:
  create_event_summaries:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - name: Install mpop
        run: sudo apt-get install -y mpop
      - name: Configure mpop
        env:
          MPOPRC: ${{ secrets.MPOPRC }}
        run: |
          envsubst <<< $(echo $MPOPRC | base64 --decode) > ~/.mpoprc
          chmod 600 ~/.mpoprc
      - name: Run mpop
        run: mpop
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Configure DeepSeek models for llm
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          llm keys set deepseek --value "$OPENAI_API_KEY"
          llm openai endpoint add https://api.deepseek.com/v1 -m deepseek-flash --key deepseek --supports-tools --vision --reasoning
          llm openai endpoint add https://api.deepseek.com/v1 -m deepseek-chat --key deepseek --supports-tools
          llm openai endpoint add https://api.deepseek.com/v1 -m deepseek-reasoner --key deepseek --supports-tools --reasoning
          llm models default deepseek-flash
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Configure newsletter_automation
        run: envsubst < example.ini > config.ini
      - name: Create event summaries
        run: uv run python -m newsletter_automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: '*.ics'
