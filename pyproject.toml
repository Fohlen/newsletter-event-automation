[project]
name = "newsletter-automation"
version = "0.1.0"
description = "Automatically reads a newsletter to create a calendar feed from it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai~=1.57.0",
    "tqdm~=4.67.1",
    "icalendar~=5.0.7",
    "scikit-learn~=1.5.0",
    "numpy~=1.25.1",
    "tenacity~=9.0.0",
    "instructor~=1.7.0",
    "pydantic~=2.10.3",
    "anthropic~=0.40.0",
]

[dependency-groups]
dev = [
    "mypy~=1.9.0",
    "types-tqdm~=4.65.0.1",
    "pytest~=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newsletter_automation"]
